name: Publicar portal PROEX (hospedagem própria)
# Publica apps/proex-portal numa conta Cloudflare (Workers + D1 + R2) a cada push na
# main ou manualmente. Sem os segredos configurados o job apenas avisa e termina:
# a publicação no ChatGPT Sites continua independente deste fluxo.
on:
  push:
    branches: [main]
    paths: ['apps/proex-portal/**', '.github/workflows/portal-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portal-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: producao
    defaults:
      run:
        working-directory: apps/proex-portal
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROEX_PUBLIC_URL: ${{ vars.PROEX_PUBLIC_URL }}
      PROEX_WORKER_NAME: ${{ vars.PROEX_WORKER_NAME }}
      PROEX_D1_NAME: ${{ vars.PROEX_D1_NAME }}
      PROEX_R2_BUCKET: ${{ vars.PROEX_R2_BUCKET }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
    steps:
      - name: Conferir configuração
        id: configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$PROEX_PUBLIC_URL" ]; then
            echo "::notice::Hospedagem própria não configurada. Veja apps/proex-portal/docs/HOSPEDAGEM-PROPRIA.md"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      - uses: actions/checkout@v6
        if: steps.configured.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.configured.outputs.ready == 'true'
        with:
          package_json_file: apps/proex-portal/package.json
      - uses: actions/setup-node@v6
        if: steps.configured.outputs.ready == 'true'
        with:
          node-version: 24
      - if: steps.configured.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.configured.outputs.ready == 'true'
        run: pnpm run check:types
      - if: steps.configured.outputs.ready == 'true'
        run: pnpm test
      - if: steps.configured.outputs.ready == 'true'
        run: pnpm run build
      - name: Implantar (banco, migrações, Worker e segredos)
        if: steps.configured.outputs.ready == 'true'
        run: node scripts/cloudflare/deploy.mjs
