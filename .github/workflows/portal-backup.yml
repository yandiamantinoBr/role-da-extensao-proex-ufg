name: Backup legado aposentado (não executa captura)
# Intencionalmente sem schedule e sem segredos/provedor/artefatos.
# Rotina diária atual: Apps Script opt-in, arquivo integral formato 2 no Drive.
# Consulte apps/proex-portal/docs/BACKUP-AUTOMATICO.md antes de configurar.
on:
  workflow_dispatch:
permissions: {}
jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Informar que nenhum backup foi realizado
        run: |
          echo "::error::Este backup Cloudflare foi aposentado. Nenhum backup foi criado. Configure e teste o backup diário Apps Script no portal; consulte BACKUP-AUTOMATICO.md."
          exit 1
