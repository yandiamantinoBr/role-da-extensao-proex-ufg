name: Verificar evolução PROEX
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: proex-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:legacy
      - run: pnpm run check:types
      - run: pnpm test
      - run: pnpm run build:pages
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/proex-portal
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/proex-portal/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:types
      - run: pnpm test
      - run: pnpm run build
      - run: node --import ./scripts/sites-env.mjs tests/password-auth-worker-smoke.mjs
